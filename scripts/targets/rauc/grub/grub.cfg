# Главный grub.cfg панели (лежит на efi_A вместе с GRUB и grubenv).
#
# Выбирает RAUC-слот по grubenv (ORDER/OK/TRY) и грузит kernel+initrd прямо из
# squashfs соответствующего rootfs-раздела (GRUB читает squashfs+xz нативно):
#   system0 -> rootfs_A = gpt3, system1 -> rootfs_B = gpt4
# (номера согласованы с partition-layout/pc-efi.sgdisk; раскладка НЕ меняется
# относительно v1 — см. docs/2026-07-04-grub-boot-selection-design.md).
#
# Схема повторяет референс RAUC bootloader=grub:
#   - слот загружается, только если <slot>_OK=1 и <slot>_TRY=0;
#   - перед попыткой TRY=1 сохраняется в grubenv (save_env);
#   - успешная загрузка: rauc status mark-good booted -> TRY=0 (grub-editenv);
#   - неуспешная: TRY остаётся 1, следующая перезагрузка берёт другой слот.
#
# $root к этому моменту указывает на раздел efi_A (embedded-конфиг standalone
# GRUB нашёл его по FAT-метке INAUTOBOOT).

set timeout=0

# Дефолты на случай пустого/битого grubenv (load_env их перекроет).
set ORDER="system0 system1"
set system0_OK=1
set system1_OK=1
set system0_TRY=0
set system1_TRY=0

load_env --file ($root)/grubenv

# --- выбор слота ------------------------------------------------------------

set bootname=

for SLOT in $ORDER; do
    # Сбрасываем на каждой итерации: неизвестный токен в ORDER (битый grubenv)
    # не должен матчиться по значениям OK/TRY предыдущего слота.
    set OK=0
    set TRY=1
    if [ "$SLOT" = "system0" ]; then
        set OK="$system0_OK"
        set TRY="$system0_TRY"
    fi
    if [ "$SLOT" = "system1" ]; then
        set OK="$system1_OK"
        set TRY="$system1_TRY"
    fi
    if [ "$OK" = "1" -a "$TRY" = "0" ]; then
        set bootname="$SLOT"
        break
    fi
done

# Все слоты исчерпаны (оба TRY=1 или OK=0) — last resort: первый из ORDER.
# Лучше циклически пытаться, чем остановиться навсегда.
if [ -z "$bootname" ]; then
    for SLOT in $ORDER; do
        set bootname="$SLOT"
        break
    done
fi

# --- отметить попытку ДО загрузки -------------------------------------------

echo "inauto: root=$root ORDER=$ORDER -> слот $bootname"

if [ "$bootname" = "system0" ]; then set system0_TRY=1; fi
if [ "$bootname" = "system1" ]; then set system1_TRY=1; fi
save_env --file ($root)/grubenv system0_TRY system1_TRY

# --- загрузка выбранного слота ----------------------------------------------

# Диск, с которого загрузился GRUB ($root = "hdX,gptY").
regexp --set=bootdisk '([^,]+)' "$root"

function try_boot_slot {
    # $1 = system0|system1 (любое иное значение — отказ, а не «похожий» слот)
    set bootname="$1"
    if [ "$bootname" = "system0" ]; then
        set slotdev=($bootdisk,gpt3)
        set rootpart=rootfs_A
    elif [ "$bootname" = "system1" ]; then
        set slotdev=($bootdisk,gpt4)
        set rootpart=rootfs_B
    else
        echo "inauto: неизвестный слот '$bootname' в grubenv"
        return
    fi
    if [ -f $slotdev/boot/grub-slot.cfg ]; then
        # Сниппет из rootfs слота: linux/initrd + cmdline; использует
        # $slotdev/$bootname/$rootpart, выставленные выше. Обновляется
        # вместе с bundle'ом.
        source $slotdev/boot/grub-slot.cfg
        boot
    fi
    echo "inauto: слот $bootname без /boot/grub-slot.cfg или не загрузился"
}

try_boot_slot "$bootname"

# Если дошли сюда — выбранный слот не загрузился (битый squashfs/раздел).
# Пробуем другой слот.
if [ "$bootname" = "system0" ]; then
    try_boot_slot system1
else
    try_boot_slot system0
fi

echo "inauto: ни один слот не загрузился; перезагрузка через 30 секунд"
echo "inauto: ESC — остаться в консоли GRUB для диагностики"
if sleep --interruptible 30; then
    reboot
fi
